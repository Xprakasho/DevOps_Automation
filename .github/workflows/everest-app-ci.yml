name: Project Everest Application CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/everest-app-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/everest-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, build, scan and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s app -p 'test_*.py' -v

      - name: Build container image
        run: docker build -f app/Dockerfile -t everest-demo:${{ github.sha }} app/

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: everest-demo:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Start test container
        run: docker run -d --name everest-test -p 8080:8080 everest-demo:${{ github.sha }}

      - name: Verify application health
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Health check attempt ${attempt}/20 failed; retrying..."
            sleep 1
          done

          docker logs everest-test
          exit 1

      - name: Verify application response
        run: |
          response="$(curl --fail --silent http://localhost:8080/)"
          echo "$response"
          echo "$response" | grep -F '"application":"project-everest"'
          echo "$response" | grep -F '"status":"running"'

      - name: Clean up test container
        if: always()
        run: docker rm -f everest-test || true

  publish:
    name: Publish validated image to GHCR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f app/Dockerfile -t everest-demo:${{ github.sha }} app/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          docker tag "everest-demo:${GITHUB_SHA}" \
            "ghcr.io/xprakasho/everest-demo:${GITHUB_SHA}"

      - name: Publish image to GHCR
        run: docker push "ghcr.io/xprakasho/everest-demo:${GITHUB_SHA}"

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
