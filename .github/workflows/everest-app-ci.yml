name: Project Everest Application CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/everest-app-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/everest-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Test and build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s app -p 'test_*.py' -v

      - name: Build container image
        run: docker build -f app/Dockerfile -t everest-demo:${{ github.sha }} app/
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: everest-demo:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Start test container
        run: docker run -d --name everest-test -p 8080:8080 everest-demo:${{ github.sha }}

      - name: Verify application health
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo
              echo "Application health check passed."
              exit 0
            fi

          echo "Health check attempt ${attempt}/20 failed; retrying..."
          sleep 1
          done
          docker logs everest-test
          exit 1

      - name: Verify application response
        run: |
          curl --fail --silent http://localhost:8080/
          echo

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "everest-demo:${GITHUB_SHA}" \
            "ghcr.io/xprakasho/everest-demo:${GITHUB_SHA}"

      - name: Publish image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "ghcr.io/xprakasho/everest-demo:${GITHUB_SHA}"

      - name: Clean up test container
        if: always()
        run: docker rm -f everest-test || true
