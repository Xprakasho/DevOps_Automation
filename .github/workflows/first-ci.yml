
name: First CI Pipeline

on:
  push:
    branches:
      - main # Trigger workflow on push to main branch
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
env:
  APP_NAME: DevOps_Automation
  APP_ENV: Development
  PYTHON_VERSION: "3.10"

jobs:
  create-report:
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect OIDC Claims
        run: |
          set -euo pipefail

          TOKEN=$(curl -sS \
           -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
           "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          |jq -r '.value')

          PAYLOAD=$(python3 -c
          import sys
          import json
          import base64

          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          data = json.loads(decoded)

          selected = {
          "iss": data.get("iss"),
          "sub": data.get("sub"),
          "aud": data.get("aud"),
          "repository": data.get("repository"),
          "repository_owner": data.get("repository_owner"),
          "ref": data.get("ref"),
          "sha": data.get("sha"),
          "actor": data.get("actor")
           }

           print(json.dumps(selected, indent=2))
          ' <<< "$TOKEN")

          echo "$PAYLOAD"



      - name: Display Repository Information
        run: |
          echo "========================================"
          echo "      DevOps Automation CI Pipeline"
          echo "========================================"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow   : ${{ github.workflow }}"
          echo "Run Number : ${{ github.run_number }}"
          echo "Runner OS  : $RUNNER_OS"
          echo ""
          echo "Application: $APP_NAME"
          echo "Environment: $APP_ENV"
          echo "Python     : ${{ env.PYTHON_VERSION }}"
          echo "========================================"
   
      - name: Make Bash Script Executable
        run: chmod +x scripts/bash/hello.sh

      - name: Run Bash Script
        run: ./scripts/bash/hello.sh

      - name: Create Report
        run: |
          echo "GitHub Actions Artifact Demo" > report.txt
          cat report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
            name: demo-report
            path: report.txt
             
      - name: Success Function Demo
        if: ${{ success() }}
        run: echo "All previous steps succeeded."
  python-validation:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Python Script
        if: ${{ github.ref_name == 'main' }}
        run: python scripts/python/info.py

  read-report:
    needs: create-report
    runs-on: ubuntu-latest
    steps:
     - name: Download Report
       uses: actions/download-artifact@v4
       with:
        name: demo-report
     - name: Pipeline Completed
       if: ${{ always() }}
       run: echo "✅ Pipeline completed."
