name: Project Everest Quality Gates

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "app/**"
      - "gitops/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gitops/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.14.2

      - name: Lint Python
        run: ruff check app/

      - name: Run unit tests
        run: python -m unittest discover -s app -p 'test_*.py' -v

  yaml-and-workflow-quality:
    name: YAML and GitHub Actions lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: python -m pip install yamllint==1.37.1

      - name: Lint active Everest YAML and workflows
        run: yamllint -s gitops/applications/ gitops/projects/ gitops/workloads/everest-demo/ .github/workflows/everest-quality-gates.yml

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

  dockerfile-quality:
    name: Dockerfile lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
