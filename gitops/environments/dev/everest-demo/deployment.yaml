apiVersion: apps/v1
kind: Deployment
metadata:
  name: everest-demo
  namespace: everest-dev
  labels:
    app: everest-demo
    project: project-everest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: everest-demo
  template:
    metadata:
      labels:
        app: everest-demo
        project: project-everest
    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20