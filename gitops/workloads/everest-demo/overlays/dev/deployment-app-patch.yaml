apiVersion: apps/v1
kind: Deployment
metadata:
  name: everest-demo
spec:
  template:
    spec:
      containers:
        - $patch: replace
        - name: everest-demo
          image: ghcr.io/xprakasho/everest-demo@sha256:8a772d222921d0f02c84dabf6ed16d1ca14e460446bdb16c78452bc93dd4d5b24
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
