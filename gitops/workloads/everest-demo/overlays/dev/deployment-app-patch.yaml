apiVersion: apps/v1
kind: Deployment
metadata:
  name: everest-demo
spec:
  template:
    spec:
      containers:
        - $patch: replace
        - name: everest-demo
          image: ghcr.io/xprakasho/everest-demo:b5ee7eb9ec7315f7b9b87bd38ed0e49e545421d9
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
