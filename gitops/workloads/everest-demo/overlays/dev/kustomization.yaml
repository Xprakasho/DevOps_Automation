apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: everest-dev

resources:
  - ../../base
  - namespace.yaml
  - secrets/secretstore.yaml
  - secrets/externalsecret.yaml

patches:
  - path: deployment-secret-patch.yaml

replicas:
  - name: everest-demo
    count: 3

images:
  - name: nginx
    newTag: "1.28"