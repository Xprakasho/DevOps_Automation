apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applicationset-lab-direct
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Xprakasho/DevOps_Automation.git
    targetRevision: main
    path: gitops/applicationset-lab/workload

  destination:
    server: https://kubernetes.default.svc
    namespace: applicationset-lab-direct

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
