apiVersion: batch/v1
kind: Job
metadata:
  name: sync-wave-postsync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postsync
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "PostSync hook executed"
              echo "Synchronization completed successfully"